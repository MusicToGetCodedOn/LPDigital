services:
  # 1. PostgreSQL Datenbank-Container
  postgres:
    image: postgres:16-alpine
    container_name: LPDigital-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lpdigital-network

  # 2. Backend API Container
  backend:
    image: ghcr.io/musictogetcodedon/lpdigital-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: LPDigital-backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - PORT=5000
    volumes:
      - ${BACKEND_PRIVATE_PATH:-./backend/private}:/usr/src/app/private
      - ${BACKEND_PUBLIC_PATH:-./backend/public}:/usr/src/app/public
    depends_on:
      - postgres
    networks:
      - lpdigital-network

  # 3. Frontend Container
  frontend:
    image: ghcr.io/musictogetcodedon/lpdigital-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: LPDigital-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - lpdigital-network

  # 4. Watchtower (Auto-Update-Dienst)
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    environment:
      - DOCKER_API_VERSION=1.41
      - WATCHTOWER_POLL_INTERVAL=60
      - WATCHTOWER_CLEANUP=true
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock

# Netzwerke und Volumes definieren
networks:
  lpdigital-network:
    driver: bridge

volumes:
  postgres_data: